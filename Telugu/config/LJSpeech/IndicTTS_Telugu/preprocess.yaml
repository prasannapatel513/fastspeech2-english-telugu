
dataset: "IndicTTS_Telugu"

path:
  corpus_path: "C:/Users/Laxmi prasanna/OneDrive/Documents/Telugu_TTS_Project/datasets/IndicTTS_Telugu_HF"
  lexicon_path: ""
  raw_path: "./raw_data/IndicTTS_Telugu"
  preprocessed_path: "./preprocessed_data/IndicTTS_Telugu"

preprocessing:
  val_size: 0
  text:
    text_cleaners: ["basic_cleaners"]
    language: "te"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "phoneme_level"
    normalization: True
  energy:
    feature: "phoneme_level"
    normalization: True
